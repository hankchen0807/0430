<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>文字裝飾</title>
  <style>
    body {
      font-size: 30px;
      font-weight: bold;
      line-height: 2.5;
    }

    /* 第一種：紅色實線底線 */
    .solid-underline {
      text-decoration: underline;
      text-decoration-color: red;
      text-decoration-thickness: 8px;
      text-underline-offset: 5px;
    }

    /* 第二種：綠色波浪底線 */
    .wavy-underline {
      text-decoration-line: underline;
      text-decoration-style: wavy;
      text-decoration-color: green;
      text-underline-offset: 5px;
    }

    /* 第三種：橘色透明中間橫線（你提供的效果） */
    .midline-highlight {
      position: relative;
      display: inline-block;
    }

    .midline-highlight::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 12px;
      background: rgba(255, 165, 0, 0.4); /* 橘色半透明 */
      transform: translateY(-50%);
      z-index: -1;
    }

    /* 第四種：紫色波浪背景 */
    .wave-background {
      background: repeating-linear-gradient(
        -45deg,
        #6a5acd,
        #6a5acd 10px,
        #8a2be2 10px,
        #8a2be2 20px
      );
      color: white;
      padding: 0 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="solid-underline">今天心情真好!!</div><br>
  <div class="wavy-underline">今天心情真好!!</div><br>
  <div class="midline-highlight">今天心情真好!!</div><br>
  <div class="wave-background">今天心情真好!!</div>
</body>
</html>
